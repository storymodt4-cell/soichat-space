<style>.ring{transform-box:view-box;transform-origin:220px 220px;animation:rg 2.4s ease-out infinite}.r2{animation-delay:-.8s}.r3{animation-delay:-1.6s}
.rock{animation:sk .1s linear infinite alternate}.fl{transform-box:fill-box;transform-origin:50% 0;animation:fl .18s ease-in-out infinite alternate}.stk{animation:st 1.2s ease-in-out infinite alternate}
@keyframes rg{0%{transform:scale(.35);opacity:0}25%{opacity:.9}100%{transform:scale(1.15);opacity:0}}
@keyframes sk{from{transform:translate(-.8px,0)}to{transform:translate(.8px,.6px)}}
@keyframes fl{from{transform:scaleY(.85)}to{transform:scaleY(1.2)}}
@keyframes st{from{opacity:.55}to{opacity:1}}
@media (prefers-reduced-motion:reduce){.ring,.rock,.fl,.stk{animation:none}}</style>
